[project]
name = "bento"
version = "v0.0.2"
description = "A personal finance management system built with Beancount and Fava, providing automated transaction imports and classification."
authors = [
    { name = "pzany", email = "p.zhiang@gmail.com" }
]
readme = "README.md"
license = "MIT"
keywords = ["beancount", "fava", "ledger", "personal finance", "email", "bot"]
requires-python = ">=3.13.2"

dependencies = [
    "loguru>=0.7.2",
    "fava>=1.29",
    "pydantic_settings>=2.6.1",

    # notification
    "python-telegram-bot>=21.11.1",

    # persistence
    "sqlalchemy>=2.0.0",

    # sink
    "beancount==2.3.5", # 2.3.6 会引入 pdfminer2 冲突
    "pdfplumber>=0.11.4",
    "PyYAML>=6.0.2",
    "pandas>=2.2.3",
    "xlrd>=2.0.1",

    # source
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "google-cloud-pubsub>=2.28.0",
    "pikepdf>=7.0.0",
    "rarfile>=4.0",
    "py7zr>=0.20.0",
    "python-magic>=0.4.25",
    "schedule>=1.2.2",
]

[project.scripts]
bento = "bento:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
